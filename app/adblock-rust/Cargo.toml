[package]
name = "lumen_adblock"
version = "0.1.0"
edition = "2021"
publish = false

# Lumen's ad blocker: Brave's adblock-rust engine (uBlock Origin filter syntax) for Android.
# Built by the Gradle task "buildLumenAdblock" into app/src/main/jniLibs.

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
# "single-thread" (a default feature) is left out: WebView asks from several threads at once,
# and without it the engine is Send + Sync.
adblock = { version = "=0.12.5", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
jni = "=0.21.1"
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
