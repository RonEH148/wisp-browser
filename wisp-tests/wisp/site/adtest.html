<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ad block test</title></head><body><h1>Ad block test</h1>
<p id="r1">AD SCRIPT: waiting</p><p id="r2">AD IMAGE: waiting</p>

function set(id,t){document.getElementById(id).textContent=t}
var s=document.createElement('script');s.src='https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js';
s.onload=function(){set('r1','AD SCRIPT: LOADED')};s.onerror=function(){set('r1','AD SCRIPT: BLOCKED')};document.head.appendChild(s);

i.src='https://securepubads.g.doubleclick.net/pagead/id?'+Date.now();
setTimeout(function(){if(document.getElementById('r1').textContent.indexOf('waiting')>0)set('r1','AD SCRIPT: TIMEOUT')},15000);
</script></body></html>
