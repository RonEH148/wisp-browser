name: Build Lumen APK

# For building straight from this source tree (the usual way is the zip upload, see LUMEN.md).
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    #the same source tree is used for Wisp: in a Wisp repository this workflow does nothing
    if: ${{ !contains(github.repository, 'wisp') }}
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.STORE_PASSWORD || secrets.SIGNING_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.SIGNING_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key from the repository secrets
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 || secrets.SIGNING_KEY_BASE64 || secrets.SIGNING_KEY || secrets.KEYSTORE }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::No signing key. Add these under Settings > Secrets and variables > Actions: KEYSTORE_BASE64 (the .jks file as base64), KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD"
            exit 1
          fi
          printf '%s' "$KS" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          FP=$(keytool -list -v -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | grep -m1 'SHA256:' | awk '{print $2}')
          if [ -z "$FP" ]; then echo "::error::The key or KEYSTORE_PASSWORD secret is wrong (keytool could not open the key)"; exit 1; fi
          echo "Signing key SHA-256: $FP"
      - name: Build Lumen (WebView engine)
        id: build
        run: |
          ./gradlew assembleFossGeckoExcludedRelease --stacktrace
          VC=$(grep -oE 'versionCode = [0-9]+' app/build.gradle.kts | grep -oE '[0-9]+')
          mkdir -p out
          cp app/build/outputs/apk/fossGeckoExcluded/release/*.apk "out/Lumen-$VC.apk"
          echo "vc=$VC" >> "$GITHUB_OUTPUT"
      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lumen-v${{ steps.build.outputs.vc }}-b${{ github.run_number }}
          name: Lumen build ${{ steps.build.outputs.vc }}
          body: Install Lumen-${{ steps.build.outputs.vc }}.apk (Lumen can also install it itself from Settings → Version).
          files: out/*.apk
